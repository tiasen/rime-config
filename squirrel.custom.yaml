# Rime patch 文件 · 鼠须管外观 + 按 App 定默认中英文
# 位置：~/Library/Rime/squirrel.custom.yaml

patch:
  # ── 外观 ────────────────────────────────────
  style/color_scheme: mac_light      # 想用深色改成 mac_dark
  style/candidate_list_layout: stacked   # 候选竖排（鼠须管 1.1+ 生效的键）
  style/font_face: "PingFang SC"     # 字体
  style/font_point: 18               # 字号（Retina 屏建议 18~20）
  style/label_font_point: 15
  style/comment_font_point: 15
  style/corner_radius: 8
  style/border_height: 8
  style/border_width: 8
  style/inline_preedit: true         # 编码跟随光标显示

  # ── 按 App 切换默认输入状态 ─────────────────
  # ascii_mode: true  = 打开就是英文；false = 打开就是中文
  # 查某个 App 的 Bundle ID：
  #   osascript -e 'id of app "WeChat"'
  app_options:
    # 终端 / 命令行：默认英文
    com.apple.Terminal:
      ascii_mode: true
    com.googlecode.iterm2:
      ascii_mode: true
    # IDE / 编辑器：默认英文
    com.microsoft.VSCode:
      ascii_mode: true
    com.jetbrains.intellij:
      ascii_mode: true
    com.apple.dt.Xcode:
      ascii_mode: true
    org.vim.MacVim:
      ascii_mode: true
      vim_mode: true      # 退出插入模式自动回英文
    # 启动器 / 搜索：纯英文
    com.apple.Spotlight:
      ascii_mode: true
    com.alfredapp.Alfred:
      ascii_mode: true
    # 聊天 / 浏览器：默认中文 + 中文标点
    com.tencent.xinWeChat:
      ascii_mode: false
      ascii_punct: false
    com.google.Chrome:
      ascii_mode: false
      ascii_punct: false
    com.apple.Safari:
      ascii_mode: false
      ascii_punct: false
