# Rime patch 文件 · 小鹤双拼方案设置
# 位置：~/Library/Rime/double_pinyin_flypy.custom.yaml

patch:
  # ── 开关默认状态 ────────────────────────────
  # 索引对应雾凇 double_pinyin_flypy.schema.yaml 里 switches 的顺序
  # （注意：官方 double-pinyin 包顺序不同，勿照抄旧索引！）：
  #   0 ascii_mode（中/A）  1 ascii_punct（中英标点）  2 traditionalization（简/繁）
  #   3 emoji  4 full_shape（半角/全角）  5 search_single_char
  # 忘了顺序就看一眼 build/double_pinyin_flypy.schema.yaml 的 switches 段。
  "switches/@2/reset": 0   # 默认简体
  "switches/@3/reset": 1   # 默认开启 emoji
  "switches/@4/reset": 0   # full_shape 默认半角（全角字母会让命令行不认）

  # ── 候选框里显示双拼编码还是全拼 ────────────
  # 默认会把 zz 显示成 zou。想显示双拼原码，放开下面两行：
  # "translator/preedit_format": []

  # ── 模糊音（南方口音按需放开）──────────────
  # 注意：模糊音规则必须写在双拼规则【之前】
  # "speller/algebra":
  #   - derive/^([zcs])h/$1/        # z ↔ zh
  #   - derive/^([zcs])([^h])/$1h$2/
  #   - derive/in$/ing/             # in ↔ ing
  #   - derive/ing$/in/
  #   - derive/en$/eng/             # en ↔ eng
  #   - derive/eng$/en/
  #   - derive/^l/n/                # n ↔ l
  #   - derive/^n/l/
  #   __include: double_pinyin_flypy.schema.yaml:/speller/algebra

  # ── 小鹤音形辅码（打了双拼后按 ; 再打形码筛选）──
  # "aux_code/show_aux_notice": "trigger"
